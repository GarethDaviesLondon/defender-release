<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Defender</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        color: #9ae6ff;
        font-family: "Courier New", monospace;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      canvas {
        display: block;
        image-rendering: pixelated;
        background: #000;
        /* The canvas is a fixed virtual resolution scaled by script; this only
           keeps it from overflowing before the first resize runs. */
        max-width: 100vw;
        max-height: 100vh;
      }

      noscript {
        padding: 2rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="960" height="640" aria-label="Defender game screen"></canvas>
    <noscript>
      This game needs JavaScript. It runs entirely in the browser and sends
      nothing anywhere.
    </noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
