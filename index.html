<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the canvas reach under a notch; the safe-area
         insets below keep the controls out from under it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Defender</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #9ae6ff;
        font-family: "Courier New", monospace;
        overflow: hidden;
        /* A game is not a document. Without these a thumb on the controls
           scrolls the page, pulls to refresh, pinch-zooms, or leaves a text
           selection caret across the buttons. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
        touch-action: none;
        /* Keep the picture crisp when the backing store is scaled. */
        image-rendering: pixelated;
      }

      noscript {
        display: block;
        padding: 2rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" aria-label="Defender game screen"></canvas>
    <noscript>
      This game needs JavaScript. It runs entirely in the browser and sends
      nothing anywhere.
    </noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
